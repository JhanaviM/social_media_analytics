services:
  - type: web
    name: sma-platform
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        value: "sqlite:///sma.db"
      - key: APIFY_API_TOKEN
        sync: false
    healthCheckPath: /auth/login
    autoDeploy: true
